[workspace]
resolver = "2"
members = ["crates/prismal-ir", "crates/prismal-kernel", "crates/prismal-runtime", "crates/prismal-syntax", "crates/prismal-present", "crates/prismal-host", "crates/prismal-web", "crates/prismal-svg", "crates/prismal-stdio", "crates/prismal-media"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.test]
opt-level = 2
